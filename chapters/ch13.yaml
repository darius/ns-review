  - id: 13.3.6/error-rates
    type: proposition
    section: "13.3.6"
    statement: >
      "Sections 8.3.3f and 8.3.4(d-g) discuss conditions that suffice to ensure that errors
      resulting from misreactions, omitted reactions, and reagent instabilities occur at rates
      <= 1e-15 per operation. ... these conditions exclude many potential reagents and
      transformations from use in reliable mechanosynthesis. It will here be assumed that choices
      compatible with these constraints are made, and that error rates in molecular mill systems
      are accordingly dominated by radiation damage." 13.3.6c: units with a ".01 probability of
      failure in a 10-year period ... Eq. (6.54) implies that this degree of reliability can be
      achieved so long as the mass is <= 2e-18 kg, assuming a background radiation level of 0.5
      rad/year" (~100 nm cube, ~350 mechanisms). Fn. 34: 1e-15 is an MTTF of ~3000 years "for a
      single device working at 1e4 operations per second".
    hedge: "It will here be assumed"
    support: INT
    refs: ["8.3.3f", "8.3.4d-g", "Eq. 6.54"]
    polarity: "-"
    priority: high
    hypotheses:
      - 6.4.5/reagent-devices-case-by-case
      - 6.4.1/lifetime-1e20s-standard
      - 6.7.1/radiation-dominance-criterion
      - 6.7.1/single-point-failure-assumption
      - 6.5.3/shielding-assumed
      - 13.2.2/purity-1e-15-required
      - "a compatible set of reagents and reactions exists (8.3.3f, 8.3.4d-g; pending)"
      - "operating frequency ~1e4 /s per device (fn. 34)"
    spot_check: >
      exp(-1e15 × 5 rad × 2e-18 kg) -> P_fail = 0.010; 2e-18 / 5.7e-21 = 350 mechanisms; fn. 34
      MTTF 3000 yr at 1e4 /s (tests). At 13.3.7a's 1e6 /s per mechanism (also Table 14.1's rate
      for reagent-prep units), 1e-15 per op is 0.32 failures per mechanism in 10 years and ~3.2
      per 10-step prep unit; holding such a unit to 0.01 needs ~3e-18 per op (167 maJ vs 143 in
      the equilibrium reading). Not a verdict: radiation dominance holds at 1e4 /s, not at 1e6.
      Adjudicate at the 14.3.3 / 14.4.1 use sites.
    consumed_by: ["14.3.3", "14.4.5"]

  - id: 13.3.6/damage-cascades
    type: proposition
    section: "13.3.6"
    statement: >
      After a failed reaction a departing product has incorrect structure, which "will usually
      cause failures in further reactive encounters ... Accordingly, significant damage will
      rapidly result in additional damage." Per-encounter measurement and correction "appears
      excessive"; conditional repetition corrects only omitted reactions.
    hedge: "will usually ... appears excessive"
    support: BARE
    polarity: "+"
    consumed_by: ["13.3.6b"]

  - id: 13.3.6/fail-stop-gauging
    type: construction
    section: "13.3.6"
    statement: >
      Gauge rollers complementary to the correct structure; "failed reactions will usually be
      signaled by a protrusion on one of the output structures" (internal misplacements: "detection
      of the event must be indirect"). "Gauge mechanisms can reliably discriminate between
      correct and incorrect structures (Sections 11.2.3 and 11.2.4)"; detection triggers blocking
      of the subsystem; "Mobile debris species must be bound or confined." Gauges are "a small
      fraction" of encounter devices "provided that an error can safely be allowed to remain
      undetected for many operation cycle-times"; long delivery belts prevent delivery of
      mismanufactured products. "The resulting fail-stop subsystems make convenient building
      blocks" for 14.3.3.
    hedge: "will usually ... provided that"
    support: INT
    refs: ["11.2.3", "11.2.4"]
    polarity: "-"
    priority: high
    hypotheses:
      - 13.3.6/damage-cascades
      - "errors produce external protrusions (internal errors: no mechanism given)"
      - "belt transit time exceeds detection latency"
      - "blocking mechanism itself fails safe"
    consumed_by: ["14.3.3", "14.4.5"]

  - id: 13.3.7/mechanical-dissipation-1maj
    type: parameter
    section: "13.3.7"
    statement: >
      Belt 0.004 m/s (4 nm spacing, 1e6 moieties/s). Rollers (r = 5 nm, bearing 2 nm radius and
      length, 1000 N/m, 10.4.6 "more adverse parameters for band-stiffness scattering"): "~7e-20
      W" per roller, ~20 rollers -> "~1.4e-24 J per delivered moiety". Backing surfaces: 16 nm^2
      device at 1000 N/m, "~1e-19 W, or ~1e-24 J per pair sliding ... 20 nm". Cam followers
      (7.3.4 scaling): "~1e-27 J per nanometer"; thermoelastic "[Eq. (6.50)] is of the same
      order". Nonisothermal compression (7.5): "With good design practice, typical values ...
      should commonly be <= 0.1 maJ per cycle"; "A reasonable estimate of the total energy
      dissipated by mechanical operations in a ten-step mechanochemical process is therefore ~1
      maJ per moiety delivered".
    hedge: "With good design practice ... should commonly be"
    support: INT
    refs: ["10.4.6", "7.3.4", "7.5", "Eq. 6.50 [sic; thermoelastic is Eq. 7.50]"]
    polarity: "-"
    priority: high
    hypotheses:
      - 10.4.6/total-drag-bound
      - 10.12/smooth-sliding-conditions
      - 7.5.1/nonisothermal-compression
      - 7.1/mechanism-inventory
      - "1e6 operations/s per mechanism"
    spot_check: >
      Eq. 10.27 at the bearing surface speed (0.004 × 2/5 = 0.0016 m/s), k_s = 1000, r = l = 2 nm,
      R = 10, Δk/k = 0.4: 6.9e-20 W; ×20 / 1e6 = 1.4e-24 J (tests). "Eq. (6.50)" is one of the
      §6.4.5 pyrolysis reactions (6.38-6.51 are drawn reactions, untagged in the transcription);
      the thermoelastic cycle loss is Eq. 7.50. Cross-reference slip or transcription.
    notes: >
      The inventory again omits phonon viscosity (the 7.4.2 exception); at ~1e6 Hz the
      "very high frequency" branch is not in question (see import).
    consumed_by: ["13.3.7b"]

  - id: 13.3.7/naive-chemical-dissipation
    type: parameter
    section: "13.3.7"
    statement: >
      Each operation as exoergic as carbon combustion (~650 maJ/C), ten steps per atom: "~3e8
      J/kg". Each step exoergic enough for P_err <= 1e-15: "~145 maJ per step, yielding an estimate
      of ~7e7 J/kg." "(Note that the naive estimate may in fact be reasonable for systems where
      low energy dissipation is not a design objective.)"
    support: BARE
    polarity: "+"
    spot_check: "650 maJ × 10 × 5.0e25 C/kg = 3.3e8; 145 × 10 × 5.0e25 = 7.3e7 J/kg (tests)."
    notes: >
      Both exceed the ~1.5e7 J/kg free energy of 14.4.8's acetone process: at these values the
      system is a net energy consumer, not a producer.

  - id: 13.3.7/reversible-limit-1e5
    type: proposition
    section: "13.3.7"
    statement: >
      "As discussed in Section 8.5.2b, reliable mechanochemical operations can in some instances
      approach thermodynamical reversibility in the limit of slow motion." At 1e6 /s many
      dissipate energies "in the range characteristic of mechanical motions"; with "only
      reliable, nearly reversible steps" dissipation "could approach zero, and in practice be ~1
      maJ per atom, or ~1e5 J/kg." "The conditions for combining reliability and near
      reversibility are, however, quite stringent": moieties must favour the initial structure on
      encounter and the product "by ~145 maJ" on separation.
    hedge: "can in some instances ... could approach"
    support: INT
    refs: ["8.5.2b", "13.3.7a"]
    polarity: "-"
    hypotheses:
      - "a complete set of reliable, nearly reversible steps exists (assumed)"
    spot_check: "1 maJ × 5.0e25 = 5e4 J/kg (book ~1e5)."

  - id: 13.3.7/conditional-repetition-loosens
    type: parameter
    section: "13.3.7"
    statement: >
      With conditional repetition the required modulation is "~(5 + 145/N) maJ", 5 maJ being the
      bias favouring the initial structure; "the energy dissipated can be ~1 maJ per operation.
      For N = 10, the required energy difference (~20 maJ) can be induced by relatively modest
      manipulations of bond strain, overlap energy, electrostatics, or electronic structure."
      "a simple conditional-repetition process with N = 10 can achieve high reliability with an
      exoergicity (and energy dissipation) of ~15 maJ per operation".
    hedge: "can be induced by relatively modest"
    support: INT
    refs: ["8.3.4f", "13.3.1c"]
    polarity: "-"
    priority: high
    hypotheses:
      - 13.3.1/conditional-repetition
      - "per-try outcomes independent (P^N)"
      - "modulation of ~20 maJ achievable by 'modest manipulations' (no example)"
    spot_check: "5 + 145/10 = 19.5 maJ; kT ln(1e15)/10 = 14.3 maJ (tests)."

  - id: 13.3.7/application-dissipation
    type: proposition
    section: "13.3.7"
    statement: >
      "In reagent preparation, the feasibility of tailoring the entire reaction environment should
      commonly permit the use of low-dissipation operations; but in reagent application, the
      prospects are less clear." Single-transition-state group transfers: "it should commonly be
      feasible" to choose moderately exoergic reagents (~15 maJ) or modulate bond strengths (~1
      maJ). Strong-bond reagents: net exoergicity "can often be reduced to low values by imposing
      mechanical constraints"; strain relieved by cam-controlled motion "thus avoiding the
      production of thermal vibrational energy". Radical coupling (8.5.3b) "shows that a stiff
      mechanism can form highly exoergic bonds (~500 maJ) without substantial energy
      dissipation".
    hedge: "should commonly ... less clear ... can often"
    support: INT
    refs: ["8.3.3c", "8.5", "8.5.3b"]
    polarity: "-"
    priority: high
    hypotheses:
      - 13.3.4/application-constrained
      - 13.3.3/prep-environment-tailored
      - 13.2.3/bonding-in-receptor
      - "cam-driven strain relief is adiabatic (no calculation)"
    consumed_by: ["13.3.7b"]

  - id: 13.3.7/mill-dissipation-1.5e6
    type: parameter
    section: "13.3.7"
    statement: >
      "it seems reasonable to assume that nearly reversible pathways can be followed in reagent
      preparation, and that most reagent application steps are either nearly reversible or
      dissipate an amount of energy characteristic of a moderately exoergic reaction. In this
      picture, many reactions dissipate ~1 maJ, some dissipate ~15 maJ, and a few ... dissipate
      ~100 maJ or more. If the mean energy dissipated per operation is ~30 maJ, and the mean
      number of atoms transferred is ~1, then the energy dissipated per kilogram of product is
      ~1.5e6 J."
    hedge: "it seems reasonable to assume ... If the mean ... is ~30 maJ"
    support: BARE
    polarity: "-"
    priority: high
    hypotheses:
      - 13.3.7/conditional-repetition-loosens
      - 13.3.7/application-dissipation
      - 13.3.7/mechanical-dissipation-1maj
      - 13.3.4/application-constrained
      - 13.3.6/error-rates
      - "the 1 / 15 / 100 maJ mix and its ~30 maJ mean (no distribution or example set given)"
      - "~1 (application) operation per atom of product; preparation steps near-reversible"
      - 8.5.2b/near-reversible-reliable-operations
      - 8.5.5/radical-addition-dissipation-open
      - 8.5.3c/spin-dissipation
    spot_check: >
      30 maJ × 5.0e25 C/kg = 1.5e6 J/kg (tests): one 30-maJ operation per atom. 13.3.3 gives ~10
      preparation encounters per moiety. The reading consistent with the text: the 30 maJ mean is
      over application operations and preparation is near-reversible ("it seems reasonable to
      assume that nearly reversible pathways can be followed in reagent preparation"), adding
      ~10 × 1 maJ, so ~40 maJ/atom = 2.0e6 J/kg (+33%). A 30 maJ mean over all ~11 operations
      would need application steps averaging ~320 maJ, contradicting the stated mix, so that
      reading is not live. The lever is preparation reversibility: at 13.3.7b's naive 145 maJ per
      step it is ~7e7 J/kg, ~5× the ~1.5e7 J/kg free energy of 14.4.8. Not a verdict.
    notes: >
      The load-bearing input to 14.4.8 (the largest dissipation term). 14.4.8's surplus vanishes
      if this term grows ~8×; waste heat grows in proportion from the start. The mix is
      asserted; the mechanisms that realise the low-dissipation classes (conditional repetition,
      strain-relief cams) are those 13.3.5 excludes from its mass estimate. Adjudicate at audit
      with 8.3.4f, 8.5.2b, 8.5.3b.
    consumed_by: ["13.3.8", "14.4.8"]
    aliases: ["1.5e6 J/kg", "~30 maJ per operation"]
    verdict: uncertain
    uncertainty_oom: 1.6
    verdict_notes: >
      Provisional. at: 14.4.8 — 2.0e6 to 7.3e7 J/kg by how preparation steps reach 1e-15 (see the
      ch14 import and nsaudit/audit_14_4_8_budget.py).

  - id: 13.3.7/errors-only-affect-energy
    type: proposition
    section: "13.3.7"
    statement: >
      "If this estimate should prove to be wrong, the only conclusions affected are those
      regarding energy consumption and waste heat generation in manufacturing processes."
    support: BARE
    polarity: "-"
    priority: high
    notes: >
      Negative claim. Waste heat sets cooling (14.4.8, 14.4.1 "supporting systems peripheral")
      and local temperature, which enters every Boltzmann reliability factor (143 maJ at 300 K).
      13.3.8's > 0.99 efficiency also rests on 13.3.7. Adjudicate at audit.

  - id: 13.3.8/mechanochemical-energy-conversion
    type: parameter
    section: "13.3.8"
    statement: >
      "The flexibility of transition-metal chemistry (Section 8.5.10) strongly suggests that a
      wide variety of reactions among small molecules can be carried out in a nearly reversible
      fashion", including 2H2 + O2 -> 2H2O (Eq. 13.8), "which yields ~475 maJ per molecule of
      product (delivered to the liquid phase)". At 1e6 /s with a 13.3.5 system: "~8e6 W/kg, or
      ~2e9 W/m^3. An overall efficiency > .99 is suggested by the energy dissipation estimates of
      Section 13.3.7. Similar results can presumably be obtained for the oxidation of small
      organic molecules." Excess feedstock hydrogen gives ~1 H2O per product carbon, "net
      exoergicity is ~400 maJ per atom".
    hedge: "strongly suggests ... is suggested ... presumably"
    support: INT
    refs: ["8.5.10", "13.3.5", "13.3.7"]
    polarity: "-"
    priority: high
    hypotheses:
      - 13.3.5/reagent-preparation-mass
      - "near-reversible transition-metal pathway for H2 + O2 exists (8.5.10; pending)"
      - "dissipation in the ~1 maJ/op reversible regime of 13.3.7, not the 30 maJ mean"
      - 13.5/open-problems
    spot_check: >
      475 maJ is ΔH_f of liquid water (285.8 kJ/mol); ΔG_f is 237.1 kJ/mol = 394 maJ, so the
      reversible work ceiling is 83% of 475. 8.1e6 W/kg and 2.4e9 W/m^3 at 475; 6.7e6 and 2.0e9 at
      394 (tests). "> .99" needs < 4.75 maJ dissipated per H2O over all its steps, i.e. the
      near-reversible branch; one operation at 13.3.7's 30 maJ mean is already 6%. Not a verdict.
    consumed_by: ["14.4.7", "14.4.8", "14.5.5"]

  # ---- 13.4 Manipulators -------------------------------------------------------------------

  - id: 13.4/manipulator-arm
    type: construction
    section: "13.4"
    statement: >
      A system building systems of equal or greater complexity avoids infinite regress via "a
      multiple-degree-of-freedom positioning mechanism, controlled either by a local nanocomputer
      or by a more remote macroscale computer ... with no simple bound on the complexity of the
      resulting products. Whether directly or indirectly, mill-style systems are likely to be
      implemented using manipulator-style systems." Thermal positioning error handled by a stiff
      mechanism (13.4.1) or self-aligning tips (13.4.2); cooling "receives no further attention".
      Many internal motions per moiety: "Peak operating frequencies can exceed 1e6 /s, although at
      a substantial (many kT_300 per operation) penalty in energy consumption. Productivity on a
      per-unit-mass basis likewise is less than for a mill-style system, but still many orders of
      magnitude greater than that of conventional macroscale manufacturing systems."
    hedge: "can exceed ... likely"
    support: INT
    refs: ["13.4.1", "13.4.2", "13.4.4"]
    polarity: "-"
    priority: high
    hypotheses:
      - 13.4.1/arm-compliance-0.04
      - 13.4.4/larger-arms-easier
      - 13.5/manipulator-efficiency-depends-on-control
    consumed_by: ["14.2.1", "14.2.2", "14.4.1"]

  - id: 13.4.1/stiffness-target
    type: parameter
    section: "13.4.1"
    statement: >
      8.5.5a: positioning stiffness of 5 to 10 N/m "should be adequate". "A reasonable design goal
      is to keep the arm compliance small compared to 0.1 m/N (e.g., 0.04 m/N)". By Eq. 2.3 a 100
      nm arm at 0.04 m/N corresponds to a meter arm at 4e-9 m/N, "quite stiff compared to present
      practice in industrial robotics, motivating a clean-slate design".
    support: INT
    refs: ["8.5.5a", "Eq. 2.3"]
    polarity: "+"
    spot_check: "0.04 × 1e-7 = 4e-9 m/N (tests)."
    consumed_by: ["13.4.1e"]

  - id: 13.4.1/arm-design
    type: construction
    section: "13.4.1"
    statement: >
      Six-axis tubular arm (Figs. 13.10-13.14): 100 nm extended length, 30 nm diameter, 3.5 nm
      wall; threaded telescoping joint J4 (0.5 nm pitch); canted rotary joints J1-J3, J5 with
      toroidal worm drives (11.3.2), threads forming "high-shear-stiffness interfaces like those
      in Section 10.4.7"; 1.5 nm drive shafts of modulus ~0.1 diamond in a torsionally stiff
      bellows core; 7 nm conveyor channel; control by clutches and odometer-like registers with no
      moment-by-moment trajectory computation (fn. 56). "the specific set of choices explored here
      is intended to demonstrate lower bounds on capabilities ... little effort has been made to
      minimize energy dissipation, to maximize speed, or to simplify kinematics."
    support: INT
    refs: ["11.3.1", "11.3.2", "10.4.7", "9.3.3"]
    polarity: "+"
    hypotheses:
      - 9.3.3/bounded-continuum
      - 10.4.7/interface-catalogue
      - "toroidal worm drives with ratios > 3000 at this size (11.3.2; pending)"
      - "bellows torsional compliance 'can be made comparatively negligible' (no calculation)"
    consumed_by: ["13.4.1e", "13.4.1f"]

  - id: 13.4.1/arm-compliance-0.04
    type: parameter
    section: "13.4.1"
    statement: >
      Table 13.1 (worst case: full J4 extension, maximum bending): tube bending 13.6 (E = 1e12,
      r 11.5-15 nm, 0.1 nm surface correction), joint rocking 0.05 each × (tip distance / joint
      radius)^2, joint torsion 0.31 × multipliers, S1 torsion 0.11 × 25 (all mm/N); drive system
      <= 0.004 m/N with speed reductions 190, 70, 65 (J2, J3, J5) and 50 (J1). "The total arm
      compliance estimated in Table 13.1 is 0.04 m/N, corresponding to a stiffness of 25 N/m",
      compatible with ~0.1 m/N workpiece and moiety compliance at error rates <= 1e-15 (8.5.5a);
      1 nN deflects the arm 0.04 nm.
    support: INT
    refs: ["Table 13.1", "8.5.5a", "9.4.2", "10.4.7 (Fig. 10.17)"]
    polarity: "+"
    priority: high
    hypotheses:
      - 13.4.1/arm-design
      - 9.8/bulk-stiffness-applies
      - "mean stiffness 10 N/m per close interatomic contact (assumed, no reference)"
      - "E = 1e12 on the structural section"
    spot_check: >
      Tube bending L^3/3EI = 13.6 mm/N and the table sum 0.040 m/N reproduce; torsion (640
      contacts × 10 N/m, two interfaces in series) = 0.31 mm/N reproduces (tests). Rocking does
      not: a ring of 650 axial 10 N/m springs measured at maximum stretch has stiffness n k / 2,
      compliance 3.1e-4 m/N, not ~3e-5. With it the total is ~0.087 m/N (~11.5 N/m); with 10.11's
      0.5 stiffness factor on E as well, ~0.10 m/N (~10 N/m), the whole 0.1 m/N budget. The
      printed "Total 4.0" row and "m/mN" header are transcription artefacts for ~40 mm/N. Not a
      verdict: the book's rocking model is not stated.
    consumed_by: ["13.4.3"]

  - id: 13.4.1/manipulator-dissipation-100maj
    type: parameter
    section: "13.4.1"
    statement: >
      Typical move 0.25-0.5 nm between operations on (111); "Treating 0.5 nm as a typical
      displacement ... should yield conservative estimates". J3/J5 orientation moves cause ~10 nm
      tip displacements compensated by J1/J2; in ~1e-6 s the J2 drive ring slides at ~1 m/s.
      Interfacial shear stiffness ~100 N/m, T_trans ~1e-4 (Eq. 7.41); 10.4.6 assumptions over
      ~200 nm^2 give ~10 maJ per motion. "An estimate of ~100 maJ per motion for the arm as a whole
      therefore appears generous. Note, however, that this estimate does not include energy
      dissipated in the power and control system, and is rather crude." ~1 atom per motion: 100
      maJ is "significant"; a 2 nm, ~1000-atom cluster: "a trivial ~0.1 maJ" per atom. ~5e6 atoms
      per arm: builds its own mass in ~5 s.
    hedge: "appears generous ... rather crude"
    support: INT
    refs: ["Eq. 7.41", "10.4.6"]
    polarity: "-"
    priority: high
    hypotheses:
      - 10.4.6/total-drag-bound
      - 13.5/manipulator-efficiency-depends-on-control
      - "power and control dissipation excluded"
    spot_check: >
      5e6 atoms / 1e6 per s = 5 s (tests). 100 maJ per 1-atom motion is 5e6 J/kg, over 3× the
      13.3.7 mill budget; 14.4.8's "comparatively negligible" manipulator term requires
      block-scale (>= ~1e3 atoms) placement. The ~10 maJ is order-consistent with 10.4.6's sample
      bearing (2.7e-14 W at 1 m/s -> ~27 maJ per microsecond) but its R and Δk/k are not stated.
    consumed_by: ["14.4.8"]

  - id: 13.4.2/self-aligning-tips
    type: design-license
    section: "13.4.2"
    statement: >
      Intermediate structures "can be limited to surface irregularities of atomic height";
      sterically complementary tips bring the tip "into stiff alignment (compliance <= 0.01 m/N)
      with the surface before the final reactive encounter", via adjustable probes or pre-attached
      probe structures; multiple-position detents (10.9.2) supply steric diversity.
    support: BARE
    refs: ["10.9.2"]
    polarity: "-"

  - id: 13.4.3/manipulator-errors-negligible
    type: proposition
    section: "13.4.3"
    statement: >
      Manipulators "will tend to have lower stiffness and hence higher error rates" than mills;
      "Nonetheless, the feasible stiffness permits errors stemming from thermal excitation to be
      kept to negligible levels (<< 1e-15), given suitable choices of reagent, reaction site, and
      encounter geometry (Sections 8.3.3f and 13.4.1e)." Programmable control permits discarding
      damaged workpieces and tools; correction "is not assumed".
    hedge: "given suitable choices"
    support: INT
    refs: ["8.3.3f", "13.4.1e", "13.4.2"]
    polarity: "-"
    priority: high
    hypotheses:
      - 13.4.1/arm-compliance-0.04
      - 6.3.1/time-dependent-pes-model

  - id: 13.4.4/larger-arms-easier
    type: proposition
    section: "13.4.4"
    statement: >
      "Within the size range where gravitational effects are negligible, the design of
      manipulator arms becomes easier with increasing size." At constant speed (2.3.2) structural
      stiffness ∝ L, joint stiffness and dissipation ∝ L^2, delivered mass ∝ L^3, time ∝ L, "the
      energy per unit mass delivered is a constant"; stiffness can be traded for lower friction.
      "Accordingly, the feasibility of stiff manipulator arms of sizes intermediate between 100 nm
      and macroscopic dimensions is assumed in the following sections without presenting
      additional design and analysis." Fn. 35: the 13.4 arm can lift 1e-10 kg with 1 nN, ~1e9 its
      own mass.
    hedge: "is assumed ... without presenting additional design and analysis"
    support: INT
    refs: ["2.3.2"]
    polarity: "-"
    priority: high
    hypotheses:
      - "gravitational effects negligible (fn. 35; Ch. 14's 10 cm arms are treated separately in 14.2.2/vibration-isolation-feasible)"
      - "constant-speed scaling (2.3.2; pending)"
    spot_check: "L^2 × L / L^3 = const."
    consumed_by: ["14.2.1"]

  - id: 13.5/manipulator-efficiency-depends-on-control
    type: scope-condition
    section: "13.5"
    statement: >
      "The efficiency of manipulator motions is expected to depend heavily on the energy
      dissipated by their control mechanisms."
    support: BARE
    polarity: "+"
    notes: >
      13.4.1f's ~100 maJ per motion excludes control; 14.4.8 prices control through the
      computation term (12.7.4) only.

  - id: 13.5/sorting-and-mill-summary
    type: proposition
    section: "13.5"
    statement: >
      Operations "can be made sufficiently tolerant of thermal excitation that damage ... occurs
      chiefly as a result of ambient ionizing radiation." Sorting "< 1 maJ per molecule"; mills
      "many operations being < 1 maJ, and an estimated mean ... ~30 maJ per operation". At 1e6
      operations/s each subsystem processes its own mass "within a few seconds".
    support: INT
    refs: ["13.2.2c", "13.3.6", "13.3.7"]
    polarity: "-"
    hypotheses:
      - 13.3.6/error-rates
      - 13.3.7/mill-dissipation-1.5e6

  - id: 13.5/open-problems
    type: scope-condition
    section: "13.5"
    statement: >
      Open problems: atomically detailed device models; exhaustive impurity-interaction studies
      for a chosen feedstock; "Many of the problems of greatest interest in mill and manipulator
      design depend on the prior characterization of a compatible set of mechanochemical
      processes"; "identifying sets of nearly thermodynamically reversible processes that can
      combine fuel and oxygen molecules."
    support: BARE
    polarity: "+"
    notes: >
      The author lists the compatible reaction set and reversible fuel oxidation as open; 13.3.6,
      13.3.7 and 13.3.8 assume both.

