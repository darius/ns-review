  - id: 13.3.5/reagent-preparation-mass
    type: parameter
    section: "13.3.5"
    statement: >
      Per encounter mechanism: close-packed belts ~2300 nm^3, ~5.7e-21 kg, ~2.9e5 atoms (basis
      for later calculations); one device pair per roller pair ~800 nm^3, ~2.0e-21 kg, ~1.0e5
      atoms. "substantially larger than would be appropriate for a simple encounter mechanism ...
      and substantially smaller than would be appropriate for a conditionally repeated
      complex-encounter mechanism ..., but should not grossly underestimate". Arbitrary ~10%
      filled volume: ~2e-23 m^3 per mechanism. Ten encounters: ~5.7e-20 kg (2.9e6 atoms);
      "high-throughput reagent processing systems can produce their own mass in deliverable
      moieties in ~3 s." Application "adds a single step to a sequence of ~10".
    hedge: "should not grossly underestimate"
    support: INT
    refs: ["13.3.3", "13.3.5a-b"]
    polarity: "-"
