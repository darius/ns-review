exports:

  # ---- 13.1 Overview ----------------------------------------------------------------------

  - id: 13.1/solution-to-vacuum
    type: design-license
    section: "13.1"
    statement: >
      "This process begins with small molecules in a liquid and ends with complex structures in
      an evacuated region." Liquids are "dense, thoroughly disordered, and can carry a wide
      variety of molecules"; vacuum "avoids both viscous drag and mechanical interference from
      stray molecules, while minimizing unwanted chemical reactions."
    support: BARE
    polarity: "+"

  # ---- 13.2 Sorting and ordering molecules ------------------------------------------------

  - id: 13.2/receptors
    type: construction
    section: "13.2.1"
    statement: >
      Modulated receptors on a sorting rotor (Fig. 13.1): cam-driven radial rods form a binding
      site, transport it inward, eject the molecule, and return blocked. "The capabilities of
      general structures can equal or exceed those of antibodies" (K_d 1e-5 to 1e-11 nm^-3,
      Alberts et al. 1989). A receptor enclosing a ~0.9 nm molecule has ~2.7 nm excluded
      diameter and ~1e3 atoms; 12 receptors per rotor gives a ~10 nm rotor of ~2e4 atoms.
      "Among differing solvent systems in which the interactions of the solvent with the ligands
      and the receptor are relatively weak and nonspecific, K_d will be relatively solvent
      independent."
    hedge: "can equal or exceed"
    support: EXT
    refs: ["Alberts et al. 1989", "9.5.4/antibody-diversity-analogy", "Eq. 13.1"]
    vintage: "OK — antibody K_d range is textbook"
    polarity: "+"
    priority: high
    hypotheses:
      - 9.5.4/antibody-diversity-analogy
      - "antibody affinity/specificity transfer to diamondoid receptors built by mechanosynthesis (no receptor designed)"
      - "solvent interacts weakly and nonspecifically with ligand and receptor"
    consumed_by: ["13.2.2", "13.2.3"]
    aliases: ["sorting rotor", "modulated receptor mechanism"]

  - id: 13.2.1/receptor-occupancy-99
    type: parameter
    section: "13.2.1"
    statement: >
      Diffusion-controlled binding "typically ~1e9 s^-1 nm^-3 (Creighton, 1984)"; with several
      tens of species at >= 0.1 nm^-3, "~100 encounters occur in a 1e-6 second exposure time,
      ensuring equilibration. With K_d <= 1e-3 nm^-3, the probability of receptor occupancy is
      >= ~.99."
    support: EXT
    refs: ["Creighton 1984", "Eq. 13.1"]
    vintage: "OK"
    polarity: "+"
    hypotheses:
      - "1e-6 s receptor exposure (1e6 operations/s)"
    spot_check: "Eq. 13.1 with c = 0.1, K_d = 1e-3 nm^-3: P_occ/P_unocc = 100, P_occ = 0.99."

  - id: 13.2.1/concentration-work-20maj
    type: parameter
    section: "13.2.1"
    statement: >
      Delivering receptor contents to a high-concentration compartment requires "a work of
      concentration amounting to ~20 maJ per molecule at 300 K"; with greater drive forces a
      modulated receptor "can easily pump against pressures of several gigapascal ... at an
      energy cost on the order of 100 maJ per molecule." Drive mechanisms "are not considered
      here".
    hedge: "can easily"
    support: BARE
    polarity: "+"
    spot_check: "kT ln(1/0.01) = 19 maJ at 300 K (tests)."
    consumed_by: ["13.2.2"]

  - id: 13.2.1/diamondoid-receptors-superior
    type: proposition
    section: "13.2.1"
    statement: >
      "Diamondoid structures have advantages over proteins in their feasible affinities and
      specificities. In general, stiffer structures permit greater specificity." Diamondoid
      stiffness greater "by several orders of magnitude, permitting significant improvements in
      specificity"; greater atom density gives stronger van der Waals binding; design freedom
      "will often permit better matching".
    hedge: "will often"
    support: BARE
    refs: ["Creighton 1984 (protein stiffness only)"]
    polarity: "+"
    notes: >
      Proteins are cited; the diamondoid comparison is not. Stiffer receptors also forgo induced
      fit; adjudicate at audit whether "stiffer -> more specific" holds for the category-1
      (smaller-ligand) case.

  - id: 13.2.1/kinetic-control-avoided
    type: scope-condition
    section: "13.2.1"
    statement: >
      High affinity can give slow competitor dissociation, so that occupancy "is controlled by
      competitive binding kinetics, rather than by equilibria; this typically results in poor
      discrimination. This problem does not arise in systems with K_d > ~1e-3 nm^-3 and having
      ~1e-6 s receptor exposure times."
    support: BARE
    polarity: "-"
    consumed_by: ["13.2.2"]

  - id: 13.2.1/steric-discrimination-45maj
    type: parameter
    section: "13.2.1"
    statement: >
      Eq. 13.2: K_d,1/K_d,2 ≈ exp[(ΔF_1 - ΔF_2)/kT] ≈ exp[(ΔV_1 - ΔV_2)/kT]. Missing CH3 (H in
      its place) costs "~24 maJ (Creighton, 1984), altering binding affinity by a factor of
      ~0.003". CH for N with a ~0.3 nm initial N-receptor separation: "computational experiments
      in the MM2 approximation indicate that the adverse overlap energy experienced by the
      competitor can be ~45 maJ, sufficient to alter affinities by a factor ~5e4".
    hedge: "can be"
    support: BARE
    refs: ["Creighton 1984 (24 maJ)", "Mitchell and McCammon 1991", "Straatsma and McCammon 1991"]
    polarity: "+"
    priority: high
    hypotheses:
      - 3.3.1/mm2-adopted
      - "MM2 overlap repulsion accurate at ~0.3 nm N-X contact (inside r_vdw0)"
      - "solvation, pV and entropy differences neglected (Eq. 13.2 second approximation)"
    spot_check: "exp(-24/4.14) = 0.003; exp(45/4.14) = 5.2e4 (tests)."
    notes: >
      The 45 maJ is the author's own unpublished MM2 computation, hence BARE. 3.3.2 states a
      "tens of percent" nonbonded-stiffness uncertainty vs MM3; at 45 maJ, 20% is ~9 maJ,
      a factor ~9 in the discrimination. Adjudicate at audit.
    consumed_by: ["13.2.1d", "13.2.2"]

  - id: 13.2.1/tight-receptor-mechanism
    type: construction
    section: "13.2.1"
    statement: >
      Paired-rotor tight receptor (Fig. 13.2): only the preferred species and strictly smaller
      ligands pass the enclosed position without a large overlap barrier; "barriers > 30 maJ
      should be easily implemented." Requires a compliant drive: rotor rotational relaxation
      "< 1e-7 s, assuming a mean viscosity of the surrounding medium like that of water
      (Creighton, 1984)"; a nonlinear compliance (~1e-12 N, negligible stiffness over several
      radians) lets a blocked bulky ligand escape. "This appears to meet the relevant
      constraints."
    hedge: "should be easily ... appears to meet"
    support: BARE
    refs: ["13.2.1c", "Creighton 1984"]
    polarity: "-"
    priority: high
    hypotheses:
      - 13.2.1/steric-discrimination-45maj
      - "nonlinear-compliance drive exists (not designed)"
      - "bulk viscosity near the rotor (fn. 31: bulk values 'no more than a rough guide')"
    consumed_by: ["13.2.2"]

  - id: 13.2.1/sorting-reversible-low-drag
    type: parameter
    section: "13.2.1"
    statement: >
      "Properly designed sorting rotor systems can approach thermodynamic reversibility in the
      limit of slow motion when handling fluids of nearly pure composition"; well-merging loss
      avoided by modulating receptor affinity via the cam profile. Viscous drag: wetted area
      ~50 nm^2, shear length ~2.7 nm, rim speed 0.0027 m/s (1e6 receptor-sites/s), eta = 1e-3:
      "~1e-16 W, or ~0.1 maJ per receptor transferred. Sliding-interface drag in associated
      bearings can be made negligible in comparison."
    hedge: "can approach ... can be made negligible"
    support: INT
    refs: ["7.6.2/merging-wells-free-energy-model"]
    polarity: "-"
    hypotheses:
      - 7.6.2/merging-wells-free-energy-model
      - "effective viscosity ~ bulk water (fn. 31: liquid-structure effects 'can be important'; bulk viscosity 'no more than a rough guide')"
      - "nearly pure fluid (else entropies of mixing significant)"
    spot_check: "eta A v^2 / L = 1.35e-16 W; / 1e6 = 0.135 maJ per receptor (tests)."
    consumed_by: ["13.2.2", "14.4.8"]

  - id: 13.2.1/receptor-lifetime
    type: proposition
    section: "13.2.1"
    statement: >
      Receptors "are, by the nature of their task, exposed to an ill-defined chemical
      environment"; diamondoid surface reactivities "resemble the reactivities of smaller organic
      molecules", so solvent-molecule stability models receptor stability: "This suggests
      reasonably long operational lifetimes." Sacrificial moieties neutralise reactive
      contaminants. Metabolic enzymes last several days (Creighton 1984); "even a one-day lifetime
      is sufficient for a device to process ~1e6 times its own mass before requiring replacement."
    hedge: "suggests reasonably long ... should be longer"
    support: EXT
    refs: ["Creighton 1984"]
    vintage: "OK"
    polarity: "-"
    priority: high
    hypotheses:
      - "reactivity of low-strain diamondoid surface patches ~ that of small organic solvent molecules"
      - "replacement (or redundancy) available at the day timescale"
    spot_check: "own mass in < 0.1 s (13.2.1e) -> > 8.6e5 own-masses per day."
    notes: >
      The only Ch. 13 mechanisms outside the eutactic baseline that Ch. 6 and 10.4.7 assume
      ("no extraneous reactive molecules"). The fallback ("even a one-day lifetime") implies
      replacement, which Ch. 14's architecture (no repair) must supply by redundancy.
      Adjudicate at audit against 14.4.1's input-ordering stage.
    consumed_by: ["14.4.1"]

  - id: 13.2.2/purity-1e-15-required
    type: parameter
    section: "13.2.2"
    statement: >
      "if a device is to perform 1e6 operations per second for several decades without an error,
      the fraction of contaminant molecules must be held to <= 1e-15. This degree of purity can
      readily be achieved (for a wide range of reasonably stable feedstock molecules) by using a
      cascade of modulated receptors."
    hedge: "can readily be achieved"
    support: BARE
    polarity: "-"
    spot_check: "1e6 /s × 3.2e7 s/yr × 30 yr ≈ 1e15."
    consumed_by: ["13.3.6"]

  - id: 13.2.2/staged-cascade-model
    type: construction
    section: "13.2.2"
    statement: >
      Counterflow cascade of N reservoirs (Fig. 13.3), mass balance Eq. 13.3; with
      stage-independent f_in, f_out, alpha_in, alpha_out and constant c_0, c_n declines
      exponentially: R = (f_rat alpha_rat)^-1 (Eq. 13.5), c_N = c_0 R^N (Eq. 13.6). "Although real
      systems will never correspond precisely to this model, it can be used to estimate".
    support: EXT
    refs: ["McCabe and Smith 1976"]
    vintage: "OK — standard counterflow cascade"
    polarity: "+"
    hypotheses:
      - "stage-independent flows and selectivities"
      - "single effective impurity (a mixture makes alpha_rat stage-dependent, as 13.2.2b notes)"

  - id: 13.2.2/cascade-five-stages
    type: parameter
    section: "13.2.2"
    statement: >
      Feedstock at 1e-2 product fraction, geometric discrimination only. First inward stage:
      impurities ~1e-4 to 1e-9 by antibody analogy; R ~1e-3 to 1e-8 with f_rat = 0.1. Later
      tight-receptor stages: "feasible values of R >= ~5e3, given f_rat = 0.1". Late impurities
      (smaller analogues) are "few", handled by selective outbound receptors. "values of
      alpha_rat >= 1e4 should be readily achievable throughout, hence analyses using R = 1e-3 will
      yield conservative results. Accordingly, producing a stream with an impurity fraction
      <= 1e-15, starting with a feedstock with an impurity fraction ~.99, should require a number
      of stages N <= 5."
    hedge: "should be readily achievable ... should require"
    support: BARE
    refs: ["13.2.1c", "13.2.1d"]
    polarity: "-"
    priority: high
    hypotheses:
      - 13.2.2/staged-cascade-model
      - 13.2.1/steric-discrimination-45maj
      - 13.2.1/tight-receptor-mechanism
      - 13.2.1/kinetic-control-avoided
      - "the set of smaller-analogue impurities is small and each gets its own outbound receptor"
    spot_check: >
      0.99 × (1e-3)^5 ≈ 1e-15: N = 5 (tests). The printed "R >= ~5e3" is the reciprocal: Eq. 13.5
      with the 45 maJ factor (5e4) and f_rat = 0.1 gives R ≈ 2e-4, 1/R ≈ 5e3. Typo or
      transcription; not load-bearing (R = 1e-3 is used).

  - id: 13.2.2/input-ordering-mass
    type: parameter
    section: "13.2.2"
    statement: >
      Many rotors in parallel "lend themselves to the construction of redundant architectures".
      Inward-flow rotors dominate dissipation: for N = 5 at ~1e6 molecules/s per row, "~0.5 maJ
      per molecule delivered"; entropy-of-mixing losses "~10% of the useful work" (~20 maJ).
      "a purification system can deliver a quantity of product equaling its own mass in < 0.5 s."
    support: INT
    refs: ["13.2.1a", "13.2.1e"]
    polarity: "-"
    hypotheses:
      - 13.2.1/sorting-reversible-low-drag
      - 13.2.2/cascade-five-stages
      - "per-rotor masses of 13.2.1a/e (~1e5 atoms incl. housing and drive share)"
    spot_check: "5 stages × 0.135 maJ = 0.7 maJ (book ~0.5). Rotor 1e5 atoms vs 1e6 molecules/s of a few heavy atoms: own mass in ~0.02-0.1 s per rotor."
    consumed_by: ["14.4.1"]

  - id: 13.2.2/hard-separations-negligible
    type: proposition
    section: "13.2.2"
    statement: >
      Shape separation fails for near-identical shapes; among small molecules of the elements of
      greatest interest, "differences in atomic valence, bond length, and nonbonded radius
      guarantee substantial differences in shape". Transition and lanthanide metals may need
      chromatography-like strategies; "separation of these more difficult elements will be a
      quantitatively small portion of the overall processing task, having little impact on such
      system parameters as mass, energy consumption, and productivity."
    hedge: "guarantee ... will be"
    support: BARE
    polarity: "-"

  - id: 13.2.3/ordered-input-steps
    type: construction
    section: "13.2.3"
    statement: >
      Ordered input by (1) reliable receptor occupancy from a pure liquid, (2) reliable covalent
      bonding to a reagent moiety on another transport, (3) transfer as a bound moiety
      (Fig. 13.5). Step 3 "is a natural consequence of the pattern of motion". Fig. 13.5 caption:
      modulation mechanisms omitted, "exposure of an empty receptor as shown would be inherently
      dissipative".
    support: BARE
    polarity: "+"
    consumed_by: ["13.3.3"]

  - id: 13.2.3/reliable-occupancy-161maj
    type: parameter
    section: "13.2.3"
    statement: >
      "A receptor will be occupied reliably (P_empty <= 1e-15) if the free energy of binding has
      a magnitude greater than ~143 maJ." Binding entropy loss "comparable to the loss of entropy
      in freezing to a crystal; for small organic molecules, a typical value is 6e-23 J/K, hence
      the required potential energy of binding is ΔV_binding ≈ -161 maJ."
    support: BARE
    polarity: "+"
    hypotheses:
      - "equilibrium (Boltzmann) occupancy at the moment of capture"
    spot_check: "kT ln 1e15 = 143 maJ; + 300 K × 6e-23 J/K = 161 maJ (tests)."
    notes: >
      Reliability from the total-equilibrium limit, as in 12.3.7 (see the 6.3.3 import). 6e-23
      J/K has no reference.

  - id: 13.2.3/ethyne-receptor-pressure
    type: parameter
    section: "13.2.3"
    statement: >
      MM2 ethyne receptor (Fig. 13.6): ΔV_binding = -97 maJ; the 64 maJ increment "can be
      supplied by hydrostatic pressure". Organic liquids stay liquid at ~1-2 GPa (methanol > 3,
      ethanol > 2, acetone and CS2 > 1 GPa) with volume per molecule ~0.75 of atmospheric (Gray
      1972); ethyne ~5e-29 m^3 -> "~1.3 GPa, at which liquids consisting of small, nonpolar
      organic molecules like ethyne are still far from solidification." "The range of feedstock
      molecules that can be ordered in this manner is large."
    hedge: "still far from ... is large"
    support: EXT
    refs: ["Gray 1972", "3.3.1/mm2-adopted"]
    vintage: "CHECK — high-pressure phase data for ethyne specifically not cited"
    polarity: "-"
    hypotheses:
      - 3.3.1/mm2-adopted
      - "liquid ethyne chemically stable at ~1.3 GPa (fn. 32: 'an open question'; polymerisation exoergic)"
    spot_check: "621 kg/m^3, 26 g/mol, ×0.75 -> 5.2e-29 m^3; 64 maJ / 5.2e-29 = 1.2 GPa (tests)."
    notes: >
      Fn. 32 flags ethyne's own stability at this pressure as open; Ch. 14's sample calculations
      use acetone instead. No receptor for acetone is shown.

  - id: 13.2.3/bonding-in-receptor
    type: proposition
    section: "13.2.3"
    statement: >
      The transfer reaction "must take the form of an addition": radical additions or
      Diels-Alder for unsaturated molecules, additions to transition metals (Eq. 8.34) for
      saturated ones; large piezochemical forces overcome barriers; "Strategies for forming
      strong bonds with little energy dissipation are available (Section 8.5.6)." But "In working
      with small molecules ... it is difficult to provide stiff restoring forces that resist
      motion of the molecule in the direction of the attacking moiety. This limitation may, for
      example, preclude low energy dissipation in radical coupling reactions involving small
      molecules (see the related discussion in Section 8.5.3b)." Any intractable feedstock "can
      be discarded in favor of an alternative."
    hedge: "may, for example, preclude"
    support: INT
    refs: ["8.5.6", "8.5.3b", "Eq. 8.34"]
    polarity: "+"
    priority: high
    notes: >
      The small-molecule caveat on 8.5.3b is the author's; 13.3.7b later invokes 8.5.3b's
      dissipation-free radical coupling for reagent application. Check at audit that the
      13.3.7 mix does not count small-molecule couplings in the ~1 maJ class.
    consumed_by: ["13.3.7"]

  # ---- 13.3 Molecular mills ----------------------------------------------------------------

  - id: 13.3/mills-impose-boundary-conditions
    type: design-license
    section: "13.3"
    statement: >
      "Chapter 8 assumes that accurately controlled mechanical motions can be imposed as a
      boundary condition in molecular systems, implying control of positions, trajectories, and
      forces during chemical transformations. This section describes mechanisms that can provide
      such control using systems of belts and rollers".
    support: INT
    refs: ["Ch. 8"]
    polarity: "-"
    priority: high
    hypotheses:
      - 13.3.1/simple-encounter-parameters
      - 10.12/smooth-sliding-conditions

  - id: 13.3.1/simple-encounter-parameters
    type: parameter
    section: "13.3.1"
    statement: >
      Simple contact-and-separation encounters (Fig. 13.7a): peak compressive load "> 10 nN"
      (8.3.3c); moiety-moiety stiffness along the line of motion "~90 N/m with sufficiently stiff
      bearings" (8.5.3d); perpendicular stiffness with sterically complementary devices under
      load "can easily exceed 50 N/m". Eq. 13.7 reaction time; v = 0.005 m/s, r = 10 nm, δ = 0.01
      nm: t_trans ≈ 1.8e-7 s, "moderately greater than the typical value assumed in Chapter 8".
      Backing surfaces prolong encounters indefinitely.
    hedge: "can easily exceed"
    support: INT
    refs: ["8.3.3c", "8.5.3d", "Eq. 13.7"]
    polarity: "+"
    hypotheses:
      - "perpendicular stiffness > 50 N/m from steric complementarity under compressive load (no calculation)"
    spot_check: "Eq. 13.7 exact and approximate forms both 1.79e-7 s (tests)."
    consumed_by: ["13.3.7"]

  - id: 13.3.1/complex-encounters
    type: design-license
    section: "13.3.1"
    statement: >
      Reagent devices with moving parts actuated by auxiliary rollers or cams: "This approach
      enables thorough control of molecular trajectories and reaction environments"; devices can
      "entirely surround the pair of moieties with a eutactic environment"; cams can "guide and
      power an arbitrarily long sequence of arbitrarily complex motions. Relatively small and
      simple mechanisms in this class are capable of exploiting pi-bond torsion effects,
      performing three-moiety encounters ... and so forth."
    support: BARE
    refs: ["8.5.6", "8.5.7"]
    polarity: "-"
    priority: high
    hypotheses:
      - "no such device designed; size and mass excluded from 13.3.5 ('substantially smaller than would be appropriate')"
    consumed_by: ["13.3.7"]

  - id: 13.3.1/conditional-repetition
    type: construction
    section: "13.3.1"
    statement: >
      Conditional repetition (8.3.4f) turns single-encounter failure P into P^n; it "can both
      increase reliability and (by permitting the use of less exoergic reactions) decrease energy
      dissipation." Reagent device with steric probe and cam follower (Fig. 13.8): probe
      extension while the group is present must be "negligible (e.g., <= 1e-15)", blocked by a
      "large (e.g., 150 maJ) energy barrier"; bias force "~0.1 nN". Groove network (Fig. 13.9)
      attempts transfer "if and only if the group has not yet been transferred". Where grooves
      merge, "If the sizes and depths of these wells are designed such that Eq. (7.73) holds,
      then the merging wells are in effect preequilibrated, and there is no fixed lower bound on
      the energy dissipation."
    hedge: "If ... designed such that"
    support: INT
    refs: ["8.3.4f", "7.6", "Eq. 7.73"]
    polarity: "-"
    priority: high
    hypotheses:
      - 7.6.2/merging-wells-free-energy-model
      - "probe discriminates presence/absence of the group at <= 1e-15"
      - "merging-well occupancies fixed and known in advance (Eq. 7.73)"
      - "corrects omitted reactions only; misreactions pass (13.3.6a)"
    consumed_by: ["13.3.6", "13.3.7"]

  - id: 13.3.2/stream-transformations
    type: construction
    section: "13.3.2"
    statement: >
      Splitting and merging streams to transform frequencies (Fig. 13.7c); smooth nonsliding
      transfer between belts at different speeds (Fig. 13.7d).
    support: BARE
    polarity: "+"

  - id: 13.3.2b/transport-network
    type: construction
    section: "13.3.2"
    statement: >
      Transfer to pallets on tracks gives flexibility "required for fault-tolerant operation".
      Fair, nonblocking merging and distribution junctions: a merging junction keeps producing
      "so long as one input stream has not failed"; a distribution junction keeps distributing
      "so long as one output stream remains unblocked". "A failed junction of either kind is
      assumed to block one or more of its inputs; in the worst case, failure blocks all inputs".
      "These simple abstract behaviors can be implemented with active mechanisms, and perhaps
      without them." The network is a demand-driven supply system: "no computational
      synchronization of production with demand is necessary."
    hedge: "can be implemented ... and perhaps without them"
    support: BARE
    polarity: "-"
    priority: high
    hypotheses:
      - "junction failure mode is blocking (assumed, not derived)"
      - "no junction mechanism designed"
    consumed_by: ["14.3.3"]

  - id: 13.3.3/prep-10-encounters
    type: parameter
    section: "13.3.3"
    statement: >
      Example: ethyne input to a strained-alkyne reagent (8.43) via two radical additions
      (8.5.5), hydrogen abstractions (8.5.4), and tool regeneration ending in H2 elimination from
      a transition metal (Eq. 8.33). "This example suggests that cycles that prepare reagent
      devices by charging them with fresh reagent moieties may typically require on the order of
      10 reactive encounters."
    hedge: "suggests ... may typically require on the order of"
    support: INT
    refs: ["8.5.4", "8.5.5", "Eq. 8.33"]
    polarity: "+"
    priority: high
    consumed_by: ["13.3.5", "13.3.7"]
    notes: >
      This is the ops-per-moiety count that 13.3.5d uses for mass and 13.3.7b's naive estimates
      use ("ten such steps"), but 13.3.7b's final 1.5e6 J/kg uses ~1 operation per atom. See
      13.3.7/mill-dissipation-1.5e6.

  - id: 13.3.3/prep-environment-tailored
    type: design-license
    section: "13.3.3"
    statement: >
      In reagent preparation, "Each of the group-transfer reactions ... can occur in an enclosing
      environment designed to facilitate that reaction, to minimize misreactions, and to minimize
      energy dissipation."
    support: INT
    refs: ["Ch. 8"]
    polarity: "-"
    consumed_by: ["13.3.7"]

  - id: 13.3.4/application-constrained
    type: scope-condition
    section: "13.3.4"
    statement: >
      In reagent application "the workpiece-side structure ... [must] be an intermediate in the
      construction of a desired device. This precludes thorough adaptation of the reaction
      environment for the purpose of facilitating reliable, low-dissipation operations.
      Nonetheless, the freedom to choose designs that can in fact be manufactured and synthetic
      sequences that generate relatively favorable intermediate structures provides considerable
      latitude".
    hedge: "provides considerable latitude"
    support: BARE
    polarity: "-"
    consumed_by: ["13.3.7"]

