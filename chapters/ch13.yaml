      room for a stiff bearing" (10.4.6, Fig. 10.17): ~310 nm^3. Encounter mechanism 4 nm cube
      (64 nm^3, "four times the volume of the exemplar interlock"); cam 4×2×10 nm (80 nm^3).
      Belt 100 nm per roller: strip 50 nm^3 or close-packed 4×4×2 devices 1600 nm^3 (50 moieties
      per mechanism). Support: five 4 nm^2 struts 15 nm long, 300 nm^3, "seems ample".
    hedge: "seems ample"
    support: BARE
    refs: ["10.4.6", "12.3.3"]
    polarity: "+"
