  - from: "7.4.2/phonon-viscosity-small-except"
    used_for: >
      Justification (never stated) for omitting phonon viscosity from the 12.3.4 mechanism
      inventory. 7.4.2 is the book's only statement of when the mechanism may be ignored, and
      its exception clause names "very high frequency motion", which a 0.1 ns switching motion
      is a candidate for.
    at: ["12.3.4"]
    cited: no
    hypotheses_discharged: no
    verdict: hypothesis-violated
    verdict_notes: >
      Spike verdict (2026-09-18), confirmed the same day after reconciliation of Ch. 3/5/6/7/10/12;
      no pending import bears on it.
      The use site never evaluates the exception; the mechanism is simply absent from the
      inventory, and Section 7.4.2 is cited nowhere in the book outside itself. Magnitude, by
      nsaudit/audit_phonon_viscosity_rod_logic.py, applying the book's own Eq. 7.53 to the
      tensioning transition (sigma = 3.1 GPa, max shear sigma/2, V = 20.5 nm^3, f_eff = 5 GHz):
      (a) with the book's tau_relax = 1e-13 s, omega·tau = 3e-3 and the loss is 1.7e-4 maJ per
      transition — the exception is NOT triggered under the book's own tau; (b) with the
      inelastic thermalization time implied by the bulk-diamond f·Q ceiling of 3.7e13 Hz
      (Chandorkar 2008 via Prase 2026), tau = 5e-12 to 1.2e-11 s, omega·tau = 0.37 at 5 GHz and
      0.74 at 10 GHz, i.e. the rod IS in the "very high frequency" regime by the modern tau, and
      the loss is 0.02 maJ per transition; (c) the tau-independent relaxation-strength bound is
      0.165 maJ per transition. Against the 2.17 maJ switching cycle of 12.3.8b, the omitted
      term adds 1.8% (modern tau) and at most 15% (worst case). So: exception not honoured,
      hypothesis violated under modern inputs, downstream impact bounded at +15% on
      12.3.8/energy-per-cycle-2maj and hence 12.7.4 — not an order of magnitude. This agrees with
      Prase's own fn. 30 (the 7.4.2 special case "can be ignored for the vibrational modes of
      individual components"); Prase's >= 2 OOM claim attaches instead to
      12.3.4/nonthermal-vibrations-by-design and 12.3.3/bounded-continuum-applies (the
      assembly as a soft molecular solid), which this edge does not adjudicate.

