- id: marblestone-2021-bottleneck
  kind: field-state
  author: Adam Marblestone
  date: 2021 (Bottlenecks 2021, Denver); reposted 2023 with updates
  url: https://longitudinal.blog/bottleneck-analysis-positional-chemistry/
  url_alt: "https://web.mit.edu/amarbles/www/docs/Bottleneck_analysis_positional_chemistry.pdf (dead as of 2026-09; Wayback has captures)"
  targets: []
  claim: >
    Not an audit of the physics. Why positional chemistry stalled (sociological bottleneck after
    Smalley; systems problem beyond one lab) and what would restart it (ARPA-like programs).
    Two paths: vacuum mechanosynthesis (CBN Nanotechnologies, Canada, ~$200M, Merkle on patents,
    no published demos) and ribosome-like molecular 3D printing in solution (DNA origami +
    spiroligomers; DOE APM program ~$8M under David Forrest, since redirected).
  status: n/a
  axis: unrefuted-vs-unpursued
  notes: >
    Directly relevant to this project: (1) proposes "an open source 'Nanosystems 2.0 with modern
    computation'" — ML potentials, accelerated DFT, web-accessible, chemists can verify — as an
    ARPA-scale program; (2) documents the Drexler-Foster 1991 papers (Nature 343:600 and two
    follow-ups) as a concrete solution-phase experimental path never followed up, distinct from
    Ch. 16's UHV route and untouched by Moriarty's Ch. 16 objection; (3) reframes diamondoid as
    chosen for analytical tractability rather than as the endpoint; (4) notes only a few pages
    of Nanosystems address how to get from here to there. Canonical URL is the blog; the blog
    text matches the PDF verbatim where checked and has a post-2021 update block; the PDF's
    appendices were seen, the blog's were not verified.

